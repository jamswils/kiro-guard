<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiro Guard — Locked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background: #080d0d;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .lock-screen {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30vh;
      background: radial-gradient(ellipse at 30% 70%, rgba(0,212,170,0.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 30%, rgba(0,180,140,0.04) 0%, transparent 50%),
                  #080d0d;
    }

    /* Kiro buddy sprite */
    .mascot-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-bottom: 28px;
    }

    .glow-pool {
      width: 180px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,212,170,0.22) 0%, transparent 70%);
      filter: blur(10px);
      margin-top: -16px;
    }

    .buddy-sprite {
      width: 220px;
      height: 220px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      filter: drop-shadow(0 0 28px rgba(0,212,170,0.3)) drop-shadow(0 18px 32px rgba(0,0,0,0.5));
      animation: float 4s ease-in-out infinite;
      transition: transform 0.6s ease, opacity 0.6s ease, filter 0.4s ease;
    }

    .buddy-sprite.success {
      animation: success-bloom 0.6s ease forwards;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }

    @keyframes success-bloom {
      0%   { transform: scale(1);    opacity: 1; }
      60%  { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1.3);  opacity: 0; }
    }

    /* Status row */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.3px;
      text-align: center;
      margin-bottom: 8px;
      min-height: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00d4aa;
      box-shadow: 0 0 10px rgba(0,212,170,0.7);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot[data-state="working"]  { background: #00d4aa; }
    .status-dot[data-state="asking"]   { background: #ffb300; box-shadow: 0 0 10px rgba(255,179,0,0.7); }
    .status-dot[data-state="waiting"]  { background: #ffb300; box-shadow: 0 0 10px rgba(255,179,0,0.7); }
    .status-dot[data-state="done"]     { background: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,0.7); }
    .status-dot[data-state="error"]    { background: #ff3b30; box-shadow: 0 0 10px rgba(255,59,48,0.7); }
    .status-dot[data-state="idle"]     { background: #00d4aa; }

    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(0.85); }
    }

    /* Sub message */
    .lock-message {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.3px;
      text-align: center;
      max-width: 420px;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* Timer */
    .elapsed-timer {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.28);
      font-family: 'Cascadia Code', 'Consolas', monospace;
      margin-bottom: 40px;
      min-height: 18px;
    }

    /* KiroCrew activity block — what the agents are doing right now */
    .crew {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin: 2px 0 10px;
      max-width: 640px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.62);
      line-height: 1.45;
      text-align: center;
    }
    .crew[data-visible="true"] { display: flex; }
    .crew-head { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.82); }
    .crew-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 640px; }
    .crew-line[data-active="true"]::before { content: "▶ "; color: #00d4aa; }
    .crew-line[data-active="false"]::before { content: "– "; color: rgba(255,255,255,0.35); }
    .crew-age { font-size: 11px; color: rgba(255,255,255,0.4); }
    .crew[data-stale="true"] .crew-head,
    .crew[data-stale="true"] .crew-age { color: #ffc460; }
    .crew[data-error="true"] .crew-head { color: #ffc460; }

    /* Passphrase input (authMode = passphrase) */
    .pass-row { display: none; gap: 8px; align-items: center; }
    .pass-row[data-visible="true"] { display: flex; }
    .pass-input {
      width: 300px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.92);
      font-size: 15px;
      font-family: inherit;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }
    .pass-input:focus { border-color: rgba(0,212,170,0.55); }
    .pass-question { font-size: 13px; color: #00d4aa; min-height: 18px; }

    /* Auth panel */
    .auth-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 1;
      transition: opacity 0.3s;
    }

    .auth-btn {
      padding: 12px 36px;
      border-radius: 10px;
      border: 1px solid rgba(0,212,170,0.35);
      background: rgba(0,212,170,0.1);
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s;
      font-family: inherit;
    }

    .auth-btn:hover {
      background: rgba(0,212,170,0.2);
      transform: scale(1.03);
    }

    .auth-btn:active { transform: scale(0.97); }

    .auth-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .auth-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      max-width: 420px;
      text-align: center;
      line-height: 1.4;
      min-height: 16px;
    }
    .auth-error {
      font-size: 12px;
      font-weight: 600;
      color: #ff3b30;
      text-shadow: 0 0 12px rgba(255,59,48,0.3);
      min-height: 16px;
      text-align: center;
      animation: shake 0.25s linear;
    }

    .auth-status {
      font-size: 13px;
      color: rgba(0,212,170,0.8);
      min-height: 18px;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .hotkey-hint {
      position: absolute;
      top: 24px;
      right: 28px;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div class="lock-screen" id="lockScreen">

  <div class="hotkey-hint" id="hotkeyHint"></div>

  <div class="mascot-wrap">
    <div id="buddy" class="buddy-sprite" aria-hidden="true"></div>
    <div class="glow-pool"></div>
  </div>

  <div class="status-row">
    <div class="status-dot" id="statusDot" data-state="idle"></div>
    <div id="statusLabel">Kiro Ready</div>
  </div>
  <div class="lock-message" id="lockMessage">Screen locked. Agents continue in the background.</div>

  <!-- Live KiroCrew activity (kirocrewFeed.ts). Hidden until the first snapshot. -->
  <div class="crew" id="crew" data-visible="false" data-stale="false" data-error="false" aria-live="polite">
    <div class="crew-head" id="crewHead"></div>
    <div id="crewLines"></div>
    <div class="crew-age" id="crewAge"></div>
  </div>

  <div class="elapsed-timer" id="elapsedTimer"></div>

  <div class="auth-panel" id="authPanel">
    <div class="auth-status" id="authStatus"></div>
    <div class="pass-question" id="passQuestion"></div>
    <div class="pass-row" id="passRow" data-visible="false">
      <input class="pass-input" id="passInput" type="password" autocomplete="off"
             aria-label="Kiro Guard passphrase" placeholder="passphrase">
    </div>
    <!-- Label is set from the lock-init payload (requireAuth) so the screen
         never promises a password step that the config will not enforce. -->
    <button class="auth-btn" id="unlockBtn" type="button">
      Unlock
    </button>
    <div class="auth-hint" id="authHint"></div>
    <div class="auth-error" id="authError"></div>
  </div>

</div>

<script>
  // ============ Sprite animation ============
  // Frames are loaded from ../../assets/pet/<state>/<state>_NNN.png at runtime.
  // We compute the URL at runtime so it's relative to the lock.html location
  // in dist/renderer/.
  const SPRITE_BASE = '../assets/pet'
  const FRAME_COUNT = {
    idle: 12, working: 12, waiting: 12, asking: 12, done: 12, error: 12,
  }
  const STATUS_LABELS = {
    idle:    'Kiro Ready',
    working: 'Kiro Processing',
    waiting: 'Kiro Waiting',
    asking:  'Kiro Asking',
    done:    'Kiro Done',
    error:   'Kiro Error',
  }
  const FRAME_INTERVAL_MS = 80
  let currentState = 'idle'
  let frameIndex = 0
  let frameTimer = null
  const buddyEl = document.getElementById('buddy')

  function pad3(n) { return String(n).padStart(3, '0') }

  // Every frame is its own PNG. Swapping background-image to a URL the browser has
  // not decoded yet paints NOTHING for a moment, which read as the buddy vanishing
  // right after a wrong password. Decode the whole state once, then swap from cache.
  const preloaded = {}
  function preloadFrames(state, total) {
    if (preloaded[state]) return preloaded[state]
    const imgs = []
    for (let i = 0; i < total; i++) {
      const img = new Image()
      img.src = `${SPRITE_BASE}/${state}/${state}_${pad3(i)}.png`
      imgs.push(img)
    }
    preloaded[state] = imgs
    return imgs
  }

  function startFrames(state) {
    if (frameTimer) clearInterval(frameTimer)
    currentState = state
    frameIndex = 0
    const total = FRAME_COUNT[state] || 12
    const frames = preloadFrames(state, total)
    const draw = () => {
      const img = frames[frameIndex]
      // Hold the previous frame rather than show a blank while this one decodes.
      if (img.complete && img.naturalWidth > 0) buddyEl.style.backgroundImage = `url('${img.src}')`
      frameIndex = (frameIndex + 1) % total
    }
    draw()
    frameTimer = setInterval(draw, FRAME_INTERVAL_MS)
  }

  function applyStatus(state) {
    const valid = ['idle', 'working', 'waiting', 'asking', 'done', 'error']
    if (!valid.includes(state)) state = 'idle'
    document.getElementById('statusDot').dataset.state = state
    document.getElementById('statusLabel').textContent = STATUS_LABELS[state]
    if (state !== currentState) startFrames(state)
  }

  // Default
  startFrames('idle')

  // ============ Elapsed timer ============
  let lockedAt = null
  let showElapsed = true

  function formatElapsed(ms) {
    const totalSecs = Math.floor(ms / 1000)
    const h = Math.floor(totalSecs / 3600)
    const m = Math.floor((totalSecs % 3600) / 60)
    const s = totalSecs % 60
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
  }

  // ============ Unlock ============
  function requestUnlock() {
    console.log('[lock] Unlock button clicked')
    if (!window.kiroLock) {
      console.error('[lock] window.kiroLock is undefined - preload did not load')
      return
    }
    if (typeof window.kiroLock.requestUnlock !== 'function') {
      console.error('[lock] window.kiroLock.requestUnlock is not a function')
      return
    }
    try {
      window.kiroLock.requestUnlock()
      console.log('[lock] requestUnlock IPC sent')
    } catch (err) {
      console.error('[lock] requestUnlock threw:', err)
    }
  }

  // Make sure the inline onclick handler can find the function on window
  window.requestUnlock = requestUnlock

  // The button is bound here, once. (An inline onclick used to be bound as well,
  // which fired requestUnlock twice per click — harmless for the Windows prompt,
  // a double submit for a passphrase.)
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('unlockBtn')
    if (btn) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation()
        requestUnlock()
      })
    }
  })

  // ============ IPC ============
  // Button label + hint must reflect what the main process will actually do
  // on click. When requireAuth is off a click unlocks immediately (that is
  // the configured behaviour, not a bug) — say so, and say where to turn
  // the password step on, instead of advertising a password prompt.
  var authMode = 'windows'
  var recoveryQuestion = ''

  // Three modes, one honest label each:
  //   windows    - button opens the Windows credential prompt
  //   passphrase - a box on the cover; Enter or the button submits it
  //   none       - a click unlocks, and the screen says so
  function applyAuthMode(mode, requireAuth) {
    authMode = mode || (requireAuth === true ? 'windows' : 'none')
    const btn = document.getElementById('unlockBtn')
    const hint = document.getElementById('authHint')
    const row = document.getElementById('passRow')
    // A mode change is a fresh start: no leftover recovery question, error text
    // or typed characters from the previous mode may survive onto the new cover.
    recoveryQuestion = ''
    document.getElementById('passQuestion').textContent = ''
    document.getElementById('authError').textContent = ''
    document.getElementById('authStatus').textContent = ''
    const pi = document.getElementById('passInput')
    pi.value = ''
    pi.placeholder = 'passphrase'
    btn.disabled = false
    row.dataset.visible = String(authMode === 'passphrase')
    if (authMode === 'windows') {
      btn.textContent = 'Unlock with Windows password'
      hint.textContent = ''
    } else if (authMode === 'passphrase') {
      btn.textContent = 'Unlock'
      hint.textContent = 'Type your Kiro Guard passphrase and press Enter.'
      setTimeout(function () { document.getElementById('passInput').focus() }, 50)
    } else {
      btn.textContent = 'Unlock'
      hint.textContent = 'Password protection is off — this unlocks immediately. ' +
        'To require a password, choose "Unlock with" in the tray menu.'
    }
  }

  function submitPassphrase() {
    const input = document.getElementById('passInput')
    const text = input.value
    if (!text) { input.focus(); return }
    input.value = ''
    document.getElementById('authError').textContent = ''
    if (window.kiroLock && typeof window.kiroLock.submitPassphrase === 'function') {
      window.kiroLock.submitPassphrase(text)
    }
  }
  window.submitPassphrase = submitPassphrase

  // In passphrase mode the Unlock button submits the box instead of asking main
  // for a Windows prompt.
  var _requestUnlockWindows = requestUnlock
  requestUnlock = function () {
    if (authMode === 'passphrase') submitPassphrase()
    else _requestUnlockWindows()
  }
  window.requestUnlock = requestUnlock

  document.addEventListener('DOMContentLoaded', function () {
    const input = document.getElementById('passInput')
    if (input) input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitPassphrase() }
    })
  })

  // ============ KiroCrew activity ============
  var lastPulse = null
  var STALE_MS = 90000

  function fmtAge(s) {
    s = Math.max(0, Math.floor(s))
    if (s < 60) return s + 's'
    if (s < 3600) return Math.floor(s / 60) + 'm'
    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm'
  }

  function renderPulse(snap, now) {
    const box = document.getElementById('crew')
    if (!snap) { box.dataset.visible = 'false'; return }
    now = now || Date.now()
    const head = document.getElementById('crewHead')
    const lines = document.getElementById('crewLines')
    const age = document.getElementById('crewAge')
    box.dataset.visible = 'true'
    box.dataset.error = String(Boolean(snap.error))
    lines.textContent = ''
    if (snap.error) {
      head.textContent = 'KiroCrew feed unreachable'
      const l = document.createElement('div'); l.className = 'crew-line'; l.textContent = snap.error
      lines.appendChild(l)
      age.textContent = 'last tried ' + fmtAge((now - snap.receivedAt) / 1000) + ' ago'
      box.dataset.stale = 'true'
      return
    }
    const bits = []
    bits.push(snap.chatsActive + (snap.chatsActive === 1 ? ' chat active' : ' chats active'))
    bits.push(snap.agentsRunning + (snap.agentsRunning === 1 ? ' agent running' : ' agents running'))
    if (snap.turnsLast10m) bits.push(snap.turnsLast10m + ' turns in 10m')
    if (snap.lastMessageAgeS !== null && snap.lastMessageAgeS !== undefined) bits.push('last message ' + fmtAge(snap.lastMessageAgeS) + ' ago')
    head.textContent = snap.headline + '  ·  ' + bits.join('  ·  ')
    const rows = (snap.chats && snap.chats.length) ? snap.chats.map(function (c) {
      return { text: c.title + '  (' + c.state + ', ' + fmtAge(c.ageS) + ')', active: c.active }
    }) : (snap.lines || []).map(function (t) { return { text: t.replace(/^[>-]\s*/, ''), active: t.charAt(0) === '>' } })
    rows.forEach(function (r) {
      const l = document.createElement('div')
      l.className = 'crew-line'; l.dataset.active = String(r.active); l.textContent = r.text
      lines.appendChild(l)
    })
    const stale = (now - snap.generatedAt) > STALE_MS
    box.dataset.stale = String(stale)
    age.textContent = 'updated ' + fmtAge((now - snap.generatedAt) / 1000) + ' ago' + (stale ? '  ·  feed stale, may be out of date' : '')
  }
  window.renderPulse = renderPulse

  window.kiroLock?.onKiroCrewPulse?.(function (snap) {
    lastPulse = snap
    renderPulse(snap)
  })

  window.kiroLock?.onRecoveryOffered?.(function (q) {
    recoveryQuestion = q
    document.getElementById('passQuestion').textContent = q ? ('Forgot it? Answer: ' + q) : ''
    document.getElementById('passInput').placeholder = q ? 'passphrase or answer' : 'passphrase'
  })

  window.kiroLock?.onInit(function(data) {
    lockedAt = data.lockedAt
    showElapsed = data.showElapsed
    if (data.message) {
      document.getElementById('lockMessage').textContent = data.message
    }
    if (data.status) applyStatus(data.status)
    applyAuthMode(data.authMode, data.requireAuth)
    if (data.kirocrewEnabled && !lastPulse) {
      // Show the block straight away so the user knows a feed is expected.
      renderPulse({ headline: 'KiroCrew', chatsActive: 0, agentsRunning: 0, turnsLast10m: 0,
                    lastMessageAgeS: null, chats: [], lines: ['connecting…'], generatedAt: Date.now(), receivedAt: Date.now() })
    }
  })

  window.kiroLock?.onStatus?.(function(payload) {
    if (payload && payload.status) applyStatus(payload.status)
  })

  window.kiroLock?.onElapsed(function(now) {
    if (lastPulse) renderPulse(lastPulse, now)
    if (!showElapsed || !lockedAt) return
    document.getElementById('elapsedTimer').textContent = formatElapsed(now - lockedAt)
  })

  window.kiroLock?.onAuthStart(function() {
    document.getElementById('unlockBtn').disabled = true
    document.getElementById('authStatus').textContent = 'Authenticating…'
    document.getElementById('authError').textContent = ''
  })

  window.kiroLock?.onAuthError(function(msg) {
    document.getElementById('unlockBtn').disabled = false
    if (authMode === 'passphrase') setTimeout(function () { document.getElementById('passInput').focus() }, 30)
    document.getElementById('authStatus').textContent = ''
    const errEl = document.getElementById('authError')
    errEl.textContent = msg
    errEl.style.animation = 'none'
    void errEl.offsetHeight
    errEl.style.animation = 'shake 0.25s linear'
  })

  window.kiroLock?.onUnlockSuccess(function() {
    if (frameTimer) clearInterval(frameTimer)
    document.getElementById('buddy').classList.add('success')
    document.getElementById('lockMessage').style.opacity = '0'
    document.getElementById('authPanel').style.opacity = '0'
    document.getElementById('elapsedTimer').style.opacity = '0'
  })
</script>
</body>
</html>
